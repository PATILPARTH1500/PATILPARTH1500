<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Parth Patil — Software Engineer">

<defs>
  <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#151514" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#minorGrid)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="1"/>
  </pattern>
  <radialGradient id="gridFade" cx="50%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="68%" stop-color="#fff" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask">
    <rect width="100%" height="100%" fill="url(#gridFade)"/>
  </mask>
  <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a8614b"/>
    <stop offset="100%" stop-color="#b28a4a"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#292924" flood-opacity=".11"/>
  </filter>
</defs>

<rect width="900" height="330" rx="30" fill="#fafafa"/>
<rect width="900" height="330" rx="30" fill="url(#majorGrid)" mask="url(#gridMask)"/>
<rect x="24" y="24" width="852" height="282" rx="26" fill="#ffffff" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".9" filter="url(#softShadow)"/>
<rect x="50" y="48" width="264" height="34" rx="17" fill="#ffffff" stroke="#deded9"/>
<circle cx="69" cy="65" r="5" fill="#7f907b"/>
<text x="84" y="70" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#343431">AVAILABLE FOR OPPORTUNITIES</text>

<text x="50" y="144" font-family="'Space Grotesk', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#151514">Engineering software</text>
<text x="50" y="199" font-family="'Space Grotesk', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="url(#accentText)">with precision &amp; scale.</text>

<text x="52" y="239" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#343431">Parth Patil · Software Engineer · AI/ML · Full-stack · IoT</text>
<text x="52" y="267" font-family="Inter, Arial, sans-serif" font-size="14" fill="#767873">Scientific systems, local AI, intelligent products and embedded prototypes.</text>

<!-- right-side schematic -->
<g transform="translate(698 70)">
  <rect x="0" y="0" width="130" height="130" rx="28" fill="#f7f7f2" stroke="#deded9"/>
  <circle cx="65" cy="65" r="34" fill="none" stroke="#a8614b" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="65" cy="65" r="12" fill="#151514"/>
  <circle cx="27" cy="30" r="5" fill="#7f907b"/>
  <circle cx="104" cy="34" r="5" fill="#b28a4a"/>
  <circle cx="105" cy="101" r="5" fill="#a8614b"/>
  <path d="M31 33 L53 53 M99 38 L79 55 M99 97 L79 78" stroke="#9a9c97" stroke-width="1.5"/>
</g>
<text x="713" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#767873">BUILD · MEASURE · VERIFY</text>
</svg>