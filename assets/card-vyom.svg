<svg xmlns="http://www.w3.org/2000/svg" width="430" height="220" viewBox="0 0 430 220" role="img" aria-label="VYOM">

<defs>
  <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#151514" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#minorGrid)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="1"/>
  </pattern>
  <radialGradient id="gridFade" cx="50%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="68%" stop-color="#fff" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask">
    <rect width="100%" height="100%" fill="url(#gridFade)"/>
  </mask>
  <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a8614b"/>
    <stop offset="100%" stop-color="#b28a4a"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#292924" flood-opacity=".11"/>
  </filter>
</defs>

<rect width="430" height="220" rx="26" fill="#fafafa"/>
<rect width="430" height="220" rx="26" fill="url(#majorGrid)" mask="url(#gridMask)"/>
<rect x="14" y="14" width="402" height="192" rx="22" fill="#ffffff" fill-opacity=".80" stroke="#ffffff" stroke-opacity=".95" filter="url(#softShadow)"/>
<rect x="28" y="28" width="102" height="26" rx="13" fill="#f7f7f2" stroke="#deded9"/>
<circle cx="41" cy="41" r="4" fill="#a8614b"/>
<text x="52" y="45" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#767873">03 / LOCAL AI</text>

<text x="28" y="91" font-family="'Space Grotesk',Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-.6" fill="#151514">VYOM</text>
<text x="28" y="116" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#343431">Local-first AI desktop intelligence layer</text>

<text x="28" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#767873">Python · Flask · Ollama · SQLite</text>
<line x1="28" y1="168" x2="294" y2="168" stroke="#deded9" />
<text x="28" y="190" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#a8614b">Voice · automation · system monitoring</text>

