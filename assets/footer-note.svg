<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Build measure verify">

<defs>
  <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#151514" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#minorGrid)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="1"/>
  </pattern>
  <radialGradient id="gridFade" cx="50%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="68%" stop-color="#fff" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask">
    <rect width="100%" height="100%" fill="url(#gridFade)"/>
  </mask>
  <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a8614b"/>
    <stop offset="100%" stop-color="#b28a4a"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#292924" flood-opacity=".11"/>
  </filter>
</defs>

<rect width="900" height="110" rx="24" fill="#10100f"/>
<path d="M0 86 C140 54, 235 101, 356 68 S620 50, 900 78" fill="none" stroke="#a8614b" stroke-opacity=".45" stroke-width="1.5"/>
<path d="M0 92 C150 75, 235 86, 356 79 S620 74, 900 87" fill="none" stroke="#7f907b" stroke-opacity=".35" stroke-width="1.2"/>
<text x="40" y="47" font-family="'Space Grotesk',Arial,sans-serif" font-size="26" font-weight="700" fill="#f7f4ea">Build it. Measure it. Make it verifiable.</text>
<text x="40" y="75" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b6b6ad">AI engineering · intelligent automation · health-tech · IoT · space-tech</text>
<circle cx="844" cy="55" r="6" fill="#7f907b"/>
</svg>